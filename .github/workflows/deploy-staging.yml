name: Deploy to Staging

# Every merge to master deploys to staging automatically. To preview a
# feature branch on staging before merging, run this workflow manually
# (Actions → Deploy to Staging → Run workflow, or
# `gh workflow run deploy-staging.yml --ref <branch>`); the next push to
# master will put staging back on master.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Only one staging deploy at a time; a newer one cancels an in-flight one
# rather than letting an older build finish last and win.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Write staging env file
        run: echo "JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}" > .env.mamusialibrary-staging

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase (staging)
        run: npx firebase-tools deploy --only functions --project staging --non-interactive
